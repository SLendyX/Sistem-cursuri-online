    <script>
        function esteTriunghi(a, b, c){ 
            if (a + b <= c || a + c <= b || b + c <= a) 
                return false; 
            else
                return true; 
        } 

        function afiseazaTipTriunghi(a,b,c){
            const laturi = [a,b,c]
            if(!esteTriunghi(a,b,c)){
                console.log(`Laturile ${laturi.toString()} nu formeaza un triunghi`)
                return
            }
            
            if(a === b && b === c){
                console.log(`Triunghiul (${laturi.toString()}) este echilateral`)
            }else if(a===b || b===c || a===c){
                console.log(`Triunghiul (${laturi.toString()}) este isoscel`)
            }else{

            }
        }
