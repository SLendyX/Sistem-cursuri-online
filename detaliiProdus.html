<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalii Produs</title>
    <link rel="stylesheet" href="detaliiProdus.css">
</head>
<body>

    <div class="container-principal">
        <h1>Detalii produs</h1>

        <div class="produs-card">
            <h2>Telefon X Pro</h2>
            
            
            
            <button id="btnDetalii">Afișează detalii</button>

            <div id="detalii">
                <p class="descriere">
                    Acest telefon dispune de un procesor octa-core de ultimă generație, 
                    o cameră de 108MP și o baterie care durează 2 zile. Este rezistent 
                    la apă și vine cu încărcare ultra-rapidă.
                </p>
                
                <p class="nota-data">
                    Informațiile sunt valabile la data: <span id="dataProdus"></span>.
                </p>
            </div>
        </div>
    </div>

    <script src="detaliiProdus.js"></script>
</body>
</html>
